<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roommies</title>
<meta name="description" content="A home base for roommates: shared expenses, chores, shopping and house info in one place.">
<meta name="theme-color" content="#4f46e5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  try { var t = localStorage.getItem('roommies.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
:root{
  --bg:#f6f5fb; --surface:#ffffff; --surface-2:#f1effa; --surface-3:#e6e3f3;
  --text:#1d1b2c; --text-muted:#585570; --border:#dcd8ea;
  --primary:#4f46e5; --primary-hover:#4338ca; --on-primary:#ffffff;
  --primary-soft:#e8e6fd; --on-primary-soft:#3730a3;
  --accent:#c2391f; --accent-soft:#fde7e3;
  --success:#15803d; --success-soft:#dcfce7;
  --warning:#9a5300; --warning-soft:#fef3c7;
  --danger:#b91c1c; --danger-soft:#fee2e2;
  --focus:#4f46e5;
  --shadow:0 1px 2px rgba(20,16,60,.06),0 6px 20px rgba(20,16,60,.06);
  --radius:18px; --radius-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121120; --surface:#1c1b2e; --surface-2:#25243a; --surface-3:#302e48;
    --text:#f1f0fa; --text-muted:#b1aec8; --border:#3a3854;
    --primary:#a5b4fc; --primary-hover:#c7d2fe; --on-primary:#1a1747;
    --primary-soft:#2c2a58; --on-primary-soft:#d4dafe;
    --accent:#ff9584; --accent-soft:#3d2422;
    --success:#4ade80; --success-soft:#173324;
    --warning:#fbbf24; --warning-soft:#3a2e12;
    --danger:#fca5a5; --danger-soft:#3b1d1f;
    --focus:#a5b4fc;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121120; --surface:#1c1b2e; --surface-2:#25243a; --surface-3:#302e48;
  --text:#f1f0fa; --text-muted:#b1aec8; --border:#3a3854;
  --primary:#a5b4fc; --primary-hover:#c7d2fe; --on-primary:#1a1747;
  --primary-soft:#2c2a58; --on-primary-soft:#d4dafe;
  --accent:#ff9584; --accent-soft:#3d2422;
  --success:#4ade80; --success-soft:#173324;
  --warning:#fbbf24; --warning-soft:#3a2e12;
  --danger:#fca5a5; --danger-soft:#3b1d1f;
  --focus:#a5b4fc;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Layout ---------- */
.app{min-height:100vh}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav .brand,.nav .side-extra{display:none}
.tabs{display:flex;width:100%;margin:0;padding:0;list-style:none}
.tabs li{flex:1;min-width:0}
.tab{width:100%;background:none;border:0;padding:9px 2px 10px;color:var(--text-muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:12px}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"] svg.i{stroke-width:2.4}
.col{min-width:0}
.main{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:1080px;margin:0 auto;outline:none}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px 10px;max-width:1080px;margin:0 auto}
.topbar .titles{flex:1;min-width:0}
.topbar .house{font-size:13px;font-weight:700;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1{font-size:24px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer-note{margin:28px 0 0;font-size:13px;color:var(--text-muted);text-align:center;padding:0 8px}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:250px minmax(0,1fr)}
  .nav{position:sticky;top:0;height:100vh;border-top:0;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
  .nav .brand{display:flex}
  .nav .side-extra{display:block;margin-top:auto}
  .tabs{flex-direction:column;gap:4px}
  .tab{flex-direction:row;gap:12px;font-size:16px;padding:11px 14px;justify-content:flex-start}
  .tab:hover{background:var(--surface-2);color:var(--text)}
  .tab[aria-current="page"]{background:var(--primary-soft);color:var(--on-primary-soft)}
  .main{padding:0 32px 48px}
  .topbar{padding:22px 32px 14px}
  .topbar h1{font-size:30px}
}
.brand{align-items:center;gap:10px;padding:0 8px;font-weight:800;font-size:22px;letter-spacing:-.01em}
.logo{width:36px;height:36px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:19px;flex:none}

/* ---------- Components ---------- */
.grid{display:grid;gap:14px}
@media (min-width:700px){.grid.two{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.grid.three{grid-template-columns:1fr 1fr 1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--text-muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border);min-width:0}
.list>li:first-child{border-top:0;padding-top:2px}
.list>li:last-child{padding-bottom:2px}
.amount{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--success)} .neg{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;border-radius:999px;border:1px solid transparent;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.soft{background:var(--primary-soft);color:var(--on-primary-soft)}
.btn.soft:hover{filter:brightness(.97)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger);color:var(--surface)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{width:40px;height:40px;min-width:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:inline-grid;place-items:center;cursor:pointer;font-size:20px;padding:0}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.plain{border-color:transparent;background:transparent;color:var(--text-muted);width:36px;height:36px;min-width:36px}
.icon-btn.plain:hover{color:var(--danger);background:var(--danger-soft)}
.icon-btn svg.i{width:20px;height:20px}
.av{width:36px;height:36px;border-radius:50%;background:var(--av,#c7d2fe);display:inline-grid;place-items:center;font-size:19px;flex:none;line-height:1;box-shadow:0 0 0 2px var(--surface)}
.av.sm{width:26px;height:26px;font-size:14px}
.av.lg{width:48px;height:48px;font-size:26px}
.avs{display:inline-flex}
.avs .av+.av{margin-left:-8px}
.me-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;font-weight:700;font-size:14px;min-height:40px}
.me-btn:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-muted);font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--success-soft);color:var(--success)}
.chip.warn{background:var(--warning-soft);color:var(--warning)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.brand{background:var(--primary-soft);color:var(--on-primary-soft)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;margin:4px 0 16px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 12px;font-weight:800;font-size:14px;color:var(--text-muted);cursor:pointer;white-space:nowrap;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--text-muted);min-height:34px}
.filters button[aria-pressed="true"]{background:var(--primary-soft);border-color:transparent;color:var(--on-primary-soft)}
.hero-stat{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cat-ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;flex:none}
.empty{padding:18px;text-align:center;color:var(--text-muted);font-size:14.5px;border:1.5px dashed var(--border);border-radius:var(--radius-sm)}
.bar{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar>span{position:absolute;top:0;bottom:0;border-radius:99px}
.dbar{height:10px;border-radius:99px;background:var(--surface-3);position:relative}
.dbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--border)}
.dbar>span{position:absolute;top:0;bottom:0;border-radius:99px}
.transfer{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius-sm);background:var(--surface-2);flex-wrap:wrap}
.transfer+.transfer{margin-top:8px}
.arrow{color:var(--text-muted);font-weight:800}
.chore{display:flex;gap:12px;align-items:flex-start}
.chore .emo{width:46px;height:46px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:24px;flex:none}
.chore.done .emo{background:var(--success-soft)}
.streak{font-weight:800;color:var(--accent);font-size:13px;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--text-muted);font-weight:700}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.wifi-pass{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;background:var(--surface-2);padding:4px 10px;border-radius:8px;letter-spacing:.04em;overflow-wrap:anywhere}
.countdown{display:flex;align-items:center;gap:12px}
.countdown .days{min-width:58px;text-align:center;background:var(--primary-soft);color:var(--on-primary-soft);border-radius:12px;padding:6px 4px;font-weight:800;line-height:1.1}
.countdown .days b{display:block;font-size:20px}
.countdown .days small{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.countdown .days.warn{background:var(--warning-soft);color:var(--warning)}
.countdown .days.bad{background:var(--danger-soft);color:var(--danger)}
.feed li{align-items:flex-start}
.feed .ic{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:16px}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0}
.banner{margin:0 16px 12px;padding:10px 14px;border-radius:12px;background:var(--warning-soft);color:var(--warning);font-weight:700;font-size:14px}
@media (min-width:900px){.banner{margin:0 32px 12px}}
.done-txt{text-decoration:line-through;color:var(--text-muted)}

/* ---------- Forms ---------- */
label.f{display:block;font-weight:800;font-size:14px;margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;padding:0;margin:0 0 14px;min-width:0}
legend{font-weight:800;font-size:14px;margin-bottom:6px;padding:0}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-pill{position:relative}
.radio-pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.radio-pill span{display:inline-flex;align-items:center;min-height:38px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--border);font-weight:700;font-size:14px}
.radio-pill input:checked+span{background:var(--primary-soft);border-color:var(--primary);color:var(--on-primary-soft)}
.radio-pill input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.check-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);min-width:0}
.check-row:first-of-type{border-top:0}
.check-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);flex:none;margin:0}
.check-row .share{width:110px;flex:none}
.check-row .share input{min-height:38px;padding:6px 10px;text-align:right}
.form-error{color:var(--danger);font-weight:700;font-size:14px;margin-top:4px}
.hint{font-size:13px;color:var(--text-muted);margin-top:6px}
.mate-row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 36px;grid-template-areas:"av name name del" "av emo col .";gap:8px;align-items:center;margin-bottom:14px}
.mate-row>.av{grid-area:av}
.mate-row>input{grid-area:name}
.mate-row>select[data-field=emoji]{grid-area:emo}
.mate-row>select[data-field=color]{grid-area:col}
.mate-row>.icon-btn,.mate-row>.del-slot{grid-area:del}
.mate-row select{padding:8px 6px}
@media (min-width:560px){
  .mate-row{grid-template-columns:40px minmax(0,1fr) 76px 96px 36px;grid-template-areas:"av name emo col del";margin-bottom:8px}
}
.list>li.wrap{flex-wrap:wrap}
.list>li.wrap>.grow{flex:1 1 170px}
.list>li.wrap>.actions{margin-left:auto;gap:6px}
@media (max-width:419px){.me-btn .me-name{display:none}.me-btn{padding:3px}}

/* ---------- Dialog ---------- */
dialog{border:0;padding:0;border-radius:22px;background:var(--surface);color:var(--text);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,12,40,.5)}
.dlg-form{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.dlg-head h2{font-size:20px;font-weight:800}
.dlg-body{padding:6px 18px 8px;overflow-y:auto}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--border)}
@media (max-width:520px){
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92vh}
  .dlg-form{max-height:92vh}
  .dlg-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .dlg-foot .btn{flex:1}
}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100vw - 32px);width:max-content;overflow-wrap:anywhere}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:28px}}

/* ---------- Onboarding ---------- */
.onb{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.onb-card{width:100%;max-width:560px}
.onb .logo{width:56px;height:56px;font-size:30px;border-radius:16px;margin-bottom:16px}
.onb h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.onb .lead{font-size:18px;color:var(--text-muted);margin-bottom:22px}
.onb .perks{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:10px}
.onb .perks li{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.onb .perks span{font-size:20px;line-height:1.2}
.onb .ctas{display:flex;gap:10px;flex-wrap:wrap}
.onb .ctas .btn{flex:1;min-width:150px;min-height:50px;font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<!-- Pure logic: no DOM access. Extracted and unit-tested by test/run_tests.sh -->
<script id="logic">
'use strict';
/* ---- Money: everything is integer cents ---- */
function toCents(input) {
  // toPrecision strips float noise first (1.005 * 100 = 100.49999999999999 -> 100.5 -> 101)
  if (typeof input === 'number') return isFinite(input) && input >= 0 ? Math.round(+(input * 100).toPrecision(12)) : NaN;
  var s = String(input == null ? '' : input).trim().replace(/^CAD\s*/i, '').replace(/[$,\s]/g, '');
  if (s === '' || s === '.' || !/^\d*(\.\d{0,2})?$/.test(s)) return NaN;
  var parts = s.split('.');
  var whole = parts[0] ? parseInt(parts[0], 10) : 0;
  var frac = parseInt(((parts[1] || '') + '00').slice(0, 2), 10);
  var c = whole * 100 + frac;
  return Number.isSafeInteger(c) ? c : NaN;
}
function fmtCAD(cents) {
  cents = Math.round(cents);
  var neg = cents < 0, a = Math.abs(cents);
  var d = Math.floor(a / 100), r = a % 100;
  return (neg ? '-' : '') + '$' + String(d).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (r < 10 ? '0' : '') + r;
}
function centsToInput(cents) { return (Math.floor(cents / 100)) + '.' + String(cents % 100).padStart(2, '0'); }
/* Split total cents equally; leftover cents go to the first people so the shares always sum to total. */
function splitEqual(total, ids) {
  var out = {};
  if (!ids.length) return out;
  var base = Math.floor(total / ids.length), rem = total - base * ids.length;
  ids.forEach(function (id, i) { out[id] = base + (i < rem ? 1 : 0); });
  return out;
}
function sumValues(o) { var s = 0; for (var k in o) s += o[k]; return s; }
/* Net balance per person: positive = the house owes them, negative = they owe the house. */
function computeBalances(memberIds, expenses) {
  var bal = {};
  memberIds.forEach(function (id) { bal[id] = 0; });
  expenses.forEach(function (e) {
    bal[e.paidBy] = (bal[e.paidBy] || 0) + e.amount;
    for (var id in e.shares) bal[id] = (bal[id] || 0) - e.shares[id];
  });
  return bal;
}
/* Minimal transfers: split people into the max number of zero-sum groups (bitmask DP),
   then settle each group greedily (k people -> at most k-1 transfers). Optimal for n <= 16. */
function settleUp(balances) {
  var people = Object.keys(balances).filter(function (k) { return balances[k] !== 0; }).sort();
  var vals = people.map(function (k) { return balances[k]; });

function openExpenseDialog(pre) {
  pre = pre || {};
  var fromShop = !!pre.shopItem;
  var body = '';
  if (fromShop) body += '<label class="check-row" style="border:0;padding-top:0"><input type="checkbox" name="share" checked><span><b>Split the cost with the house</b><br><span class="tiny muted">Uncheck if it was just a quick favour.</span></span></label>';
  body += '<div data-exp-fields>' +
    '<div class="field"><label class="f" for="x-desc">What was it?</label><input type="text" id="x-desc" name="desc" maxlength="60" required value="' + esc(pre.desc || '') + '" placeholder="e.g. Costco run"></div>' +
    '<div class="two-col"><div class="field"><label class="f" for="x-amt">Amount (CAD)</label><input type="text" id="x-amt" name="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" value="' + esc(pre.amount ? centsToInput(pre.amount) : '') + '"></div>' +
    '<div class="field"><label class="f" for="x-date">Date</label><input type="date" id="x-date" name="date" value="' + today() + '" max="' + addDays(today(), 365) + '"></div></div>' +

    '<div class="field"><label class="f" for="x-cat">Category</label><select id="x-cat" name="category">' + EXP_CATS.map(function (c) { return '<option value="' + c + '"' + (c === (pre.category || 'groceries') ? ' selected' : '') + '>' + CATS[c].emoji + ' ' + CATS[c].label + '</option>'; }).join('') + '</select></div></div>' +
    '<fieldset><legend>Split</legend><div class="radio-row"><label class="radio-pill"><input type="radio" name="mode" value="equal" checked><span>Equally</span></label><label class="radio-pill"><input type="radio" name="mode" value="custom"><span>Custom amounts</span></label></div></fieldset>' +
    '<fieldset><legend>Between</legend>' + S.members.map(function (m) {
      return '<div class="check-row"><input type="checkbox" id="xs-' + m.id + '" name="who" value="' + m.id + '" checked>' + avatar(m.id, 'sm') + '<label for="xs-' + m.id + '" class="grow ellipsis" style="font-weight:700">' + esc(m.name) + '</label>' +
        '<span class="share"><span class="tiny muted" data-eq="' + m.id + '"></span><input type="text" inputmode="decimal" name="c_' + m.id + '" aria-label="' + esc(m.name) + '’s share" placeholder="0.00" hidden></span></div>';
    }).join('') + '<p class="hint" id="x-sum" aria-live="polite"></p></fieldset></div>';
  openDialog({
    title: fromShop ? 'Bought: ' + pre.desc : 'Add expense', body: body, submit: fromShop ? 'Mark bought' : 'Add expense',
    onOpen: function (form) {
      var upd = function () {
        var custom = form.elements.mode.value === 'custom';
        var who = $$('input[name=who]:checked', form).map(function (x) { return x.value; });
        var amt = toCents(val(form, 'amount'));
        S.members.forEach(function (m) {
          var inp = form.elements['c_' + m.id], eq = form.querySelector('[data-eq="' + m.id + '"]'), on = who.indexOf(m.id) >= 0;
          inp.hidden = !custom; inp.disabled = !on; eq.hidden = custom;
          eq.textContent = on && amt > 0 ? fmtCAD(splitEqual(amt, who)[m.id]) : on ? '' : '—';
        });
        var sum = $('#x-sum', form);
        if (custom) {
          var tot = 0, bad = false;
          who.forEach(function (id) { var v = val(form, 'c_' + id); if (!v) return; var c = toCents(v); if (isNaN(c)) bad = true; else tot += c; });
          sum.textContent = bad ? 'One of the amounts isn’t a valid number.' : isNaN(amt) ? 'Shares so far: ' + fmtCAD(tot) : (tot === amt ? '✓ Shares add up to ' + fmtCAD(amt) : 'Assigned ' + fmtCAD(tot) + ' of ' + fmtCAD(amt) + ' · ' + fmtCAD(amt - tot) + ' left');
        } else sum.textContent = who.length && amt > 0 ? 'Each person pays about ' + fmtCAD(Math.ceil(amt / who.length)) + '. Leftover cents go to the first people listed.' : '';
        if (fromShop) { var on2 = form.elements.share.checked, box = form.querySelector('[data-exp-fields]'); box.style.opacity = on2 ? '1' : '.45'; $$('input:not([name=desc]), select', box).forEach(function (x) { x.disabled = !on2 || (x.name.indexOf('c_') === 0 && (!custom || who.indexOf(x.name.slice(2)) < 0)); }); }
      };
      form.addEventListener('input', upd); form.addEventListener('change', upd); upd();
    },
    onSubmit: function (form) {
      if (fromShop && !form.elements.share.checked) {
        var it = S.shopping.filter(function (x) { return x.id === pre.shopItem; })[0];
        if (it) { it.done = true; it.boughtBy = S.me; log('✅', nm2(S.me) + ' bought “' + it.name + '”'); }
        commit(); toast('Marked as bought'); return null;
      }
      var desc = val(form, 'desc'); if (!desc) return 'Give the expense a short description.';
      var amt = toCents(val(form, 'amount'));
      if (isNaN(amt) || amt <= 0) return 'Enter an amount like 42.50 (max 2 decimals).';
      if (amt > 10000000) return 'That’s over $100,000. Double-check the amount.';
      var date = val(form, 'date') || today();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return 'Pick a valid date.';
      var who = $$('input[name=who]:checked', form).map(function (x) { return x.value; });
      if (!who.length) return 'Pick at least one person to split with.';
      var mode = form.elements.mode.value, shares;
      if (mode === 'custom') {
        shares = {}; var tot = 0;
        for (var i = 0; i < who.length; i++) {
          var raw = val(form, 'c_' + who[i]), c = raw ? toCents(raw) : 0;
          if (isNaN(c)) return 'Check ' + member(who[i]).name + '’s share: use a number like 12.34.';

        }
        if (tot !== amt) return 'Custom shares add up to ' + fmtCAD(tot) + ' but the total is ' + fmtCAD(amt) + '.';
      } else shares = splitEqual(amt, who);
      var paidBy = form.elements.paidBy.value, cat = form.elements.category.value;
      S.expenses.unshift({ id: uid('e'), desc: desc, amount: amt, paidBy: paidBy, category: cat, date: date, shares: shares, splitMode: mode });
      if (fromShop) {
        var item = S.shopping.filter(function (x) { return x.id === pre.shopItem; })[0];
        if (item) { item.done = true; item.boughtBy = paidBy; }
      }
      log(CATS[cat].emoji, nm2(paidBy) + ' added “' + desc + '” — ' + fmtCAD(amt) + (mode === 'custom' ? ' (custom split)' : ''));
      if (pre.billId) { var bill = S.bills.filter(function (x) { return x.id === pre.billId; })[0]; if (bill) bill.lastPosted = monthKey(today()); }
      commit(); toast('Expense added: ' + fmtCAD(amt)); return null;
    }
  });
}

  'del-expense': function (b) {
    var e = S.expenses.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!e) return;
    confirmDialog('Delete expense?', '“' + esc(e.desc) + '” (' + fmtCAD(e.amount) + ') will be removed and balances recalculated.', 'Delete', function () {
      S.expenses = S.expenses.filter(function (x) { return x.id !== e.id; }); log('🗑️', nm2(S.me) + ' deleted “' + e.desc + '” (' + fmtCAD(e.amount) + ')'); commit(); toast('Expense deleted');
    });
  },
  settle: function (b) {
    var from = b.dataset.from, to = b.dataset.to, amt = +b.dataset.amt;
    openDialog({ title: 'Record a payment', submit: 'Record payment', noAutofocus: true,
      body: '<div class="row" style="justify-content:center;gap:12px;margin:6px 0 14px">' + avatar(from, 'lg') + '<span class="arrow" style="font-size:22px">→</span>' + avatar(to, 'lg') + '</div>' +
        '<p style="text-align:center;margin-bottom:14px"><b>' + esc(member(from).name) + '</b> pays <b>' + esc(member(to).name) + '</b></p>' +
        '<div class="field"><label class="f" for="st-amt">Amount (CAD)</label><input type="text" id="st-amt" name="amount" inputmode="decimal" value="' + centsToInput(amt) + '"></div>' +
        '<p class="hint">Send it by Interac e-Transfer in your banking app first. Roommies doesn’t move money.</p>',
      onSubmit: function (f) {
        var c = toCents(val(f, 'amount'));
        if (isNaN(c) || c <= 0) return 'Enter a valid amount.';
        if (c > amt) return 'That’s more than ' + fmtCAD(amt) + ', which would flip the debt. Record up to ' + fmtCAD(amt) + '.';
        var sh = {}; sh[to] = c;
        S.expenses.unshift({ id: uid('e'), desc: 'Payment', amount: c, paidBy: from, category: 'settlement', date: today(), shares: sh });
        log('💸', nm2(from) + ' paid ' + nm2(to) + ' ' + fmtCAD(c)); commit(); toast('Payment recorded'); return null;
      } });
  },
  'add-bill': function () {
    openDialog({ title: 'Add recurring bill', submit: 'Add bill',
      body: '<div class="field"><label class="f" for="b-name">Name</label><input type="text" id="b-name" name="name" maxlength="40" placeholder="e.g. Hydro"></div>' +
        '<div class="two-col"><div class="field"><label class="f" for="b-amt">Typical amount</label><input type="text" id="b-amt" name="amount" inputmode="decimal" placeholder="0.00"></div>' +
        '<div class="field"><label class="f" for="b-day">Due day of month</label><input type="number" id="b-day" name="day" min="1" max="31" value="1"></div></div>' +
        '<div class="two-col"><div class="field"><label class="f" for="b-cat">Category</label><select id="b-cat" name="category">' + EXP_CATS.map(function (c) { return '<option value="' + c + '"' + (c === 'utilities' ? ' selected' : '') + '>' + CATS[c].label + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label class="f" for="b-paid">Who pays it</label><select id="b-paid" name="paidBy">' + memberOptions(S.me) + '</select></div></div>' +
        '<fieldset><legend>Split between</legend>' + S.members.map(function (m) { return '<label class="check-row"><input type="checkbox" name="who" value="' + m.id + '" checked>' + avatar(m.id, 'sm') + '<span style="font-weight:700">' + esc(m.name) + '</span></label>'; }).join('') + '</fieldset>',
      onSubmit: function (f) {
        var name = val(f, 'name'), amt = toCents(val(f, 'amount')), day = parseInt(val(f, 'day'), 10);
        var who = $$('input[name=who]:checked', f).map(function (x) { return x.value; });
        if (!name) return 'Name the bill.';
        if (isNaN(amt) || amt <= 0) return 'Enter the usual amount, like 120.00.';
        if (!(day >= 1 && day <= 31)) return 'Due day must be 1–31 (short months use their last day).';
        if (!who.length) return 'Pick at least one person.';
        S.bills.push({ id: uid('b'), name: name, category: f.elements.category.value, amount: amt, dueDay: day, paidBy: f.elements.paidBy.value, splitAmong: who, lastPosted: null });
        log('🔁', nm2(S.me) + ' added a recurring bill: ' + name + ' (' + fmtCAD(amt) + '/mo)'); commit(); toast('Bill added'); return null;
      } });
  },
  'post-bill': function (b) {
    var bill = S.bills.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!bill) return;
    openDialog({ title: 'Log ' + bill.name + ' for ' + monthName(monthKey(today())), submit: 'Log & split',
      body: '<div class="field"><label class="f" for="pb-amt">This month’s amount (CAD)</label><input type="text" id="pb-amt" name="amount" inputmode="decimal" value="' + centsToInput(bill.amount) + '"></div>' +
        '<div class="field"><label class="f" for="pb-paid">Paid by</label><select id="pb-paid" name="paidBy">' + memberOptions(bill.paidBy) + '</select></div>' +
        '<p class="hint">Split equally between ' + bill.splitAmong.filter(function (id) { return !member(id).gone; }).map(function (id) { return esc(member(id).name); }).join(', ') + '.</p>',
      onSubmit: function (f) {
        var amt = toCents(val(f, 'amount')); if (isNaN(amt) || amt <= 0) return 'Enter a valid amount.';
        var who = bill.splitAmong.filter(function (id) { return !member(id).gone; }); if (!who.length) return 'Nobody left to split with. Edit the bill.';
        var paidBy = f.elements.paidBy.value, desc = bill.name + ' — ' + monthName(monthKey(today()));
        S.expenses.unshift({ id: uid('e'), desc: desc, amount: amt, paidBy: paidBy, category: bill.category, date: today(), shares: splitEqual(amt, who), splitMode: 'equal', billId: bill.id });
        bill.lastPosted = monthKey(today());
        log(CATS[bill.category].emoji, nm2(paidBy) + ' paid ' + bill.name + ' — ' + fmtCAD(amt) + ' split ' + who.length + ' ways'); commit(); toast(bill.name + ' logged and split'); return null;
      } });
  },
  'del-bill': function (b) {
    var bill = S.bills.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!bill) return;
    confirmDialog('Remove bill?', 'Stop tracking “' + esc(bill.name) + '”? Past expenses stay.', 'Remove', function () { S.bills = S.bills.filter(function (x) { return x !== bill; }); commit(); toast('Bill removed'); });
  },
  'done-chore': function (b) {
    S.chores = S.chores.map(function (c) {
      if (c.id !== b.dataset.id) return c;
      var who = choreAssignee(c), n = markChoreDone(c, S.me, today());
      log('✅', nm2(S.me) + ' marked “' + c.name + '” done' + (who !== S.me ? ' (covering for ' + nm2(who) + ')' : ''));
      return n;
    });
    commit(); toast('Nice work! 💪');
  },
  'undo-chore': function (b) { S.chores = S.chores.map(function (c) { return c.id === b.dataset.id ? undoChore(c) : c; }); commit(); },
  'del-chore': function (b) {
    var c = S.chores.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!c) return;
    confirmDialog('Delete chore?', 'Remove “' + esc(c.name) + '” and its history?', 'Delete', function () { S.chores = S.chores.filter(function (x) { return x !== c; }); commit(); });
  },
  'add-chore': function () {
    openDialog({ title: 'Add a chore', submit: 'Add chore',
      body: '<div class="two-col" style="grid-template-columns:1fr 90px"><div class="field"><label class="f" for="c-name">Chore</label><input type="text" id="c-name" name="name" maxlength="40" placeholder="e.g. Clean the fridge"></div>' +
        '<div class="field"><label class="f" for="c-emo">Icon</label><select id="c-emo" name="emoji">' + CHORE_EMOJIS.map(function (e) { return '<option>' + e + '</option>'; }).join('') + '</select></div></div>' +
        '<fieldset><legend>Rotates weekly between</legend>' + S.members.map(function (m) { return '<label class="check-row"><input type="checkbox" name="who" value="' + m.id + '" checked>' + avatar(m.id, 'sm') + '<span style="font-weight:700">' + esc(m.name) + '</span></label>'; }).join('') + '</fieldset>' +
        '<div class="field"><label class="f" for="c-first">Who’s up this week</label><select id="c-first" name="first">' + memberOptions(S.me) + '</select></div>',
      onSubmit: function (f) {
        var name = val(f, 'name'), who = $$('input[name=who]:checked', f).map(function (x) { return x.value; }), first = f.elements.first.value;
        if (!name) return 'Name the chore.';
        if (!who.length) return 'Pick at least one person for the rotation.';
        var idx = Math.max(0, who.indexOf(first));
        if (who.indexOf(first) < 0) return member(first).name + ' isn’t in the rotation. Tick them or pick someone else.';
        S.chores.push({ id: uid('c'), name: name, emoji: f.elements.emoji.value, rotation: who, idx: idx, anchor: weekStart(today()), doneWeek: null, streak: 0, history: [], missLog: [] });
        log('🧹', nm2(S.me) + ' added chore “' + name + '” (rotates between ' + who.length + ')'); commit(); toast('Chore added'); return null;
      } });
  },
  claim: function (b) { var i = S.shopping.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!i) return; i.claimedBy = S.me; log('🛒', nm2(S.me) + ' claimed “' + i.name + '”'); commit(); toast('Got it — it’s on you'); },
  unclaim: function (b) { var i = S.shopping.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!i) return; i.claimedBy = null; commit(); },
  bought: function (b) { var i = S.shopping.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!i) return; openExpenseDialog({ shopItem: i.id, desc: i.name, category: 'groceries', paidBy: S.me }); },
  'del-item': function (b) { S.shopping = S.shopping.filter(function (x) { return x.id !== b.dataset.id; }); commit(); },
  'clear-bought': function () { S.shopping = S.shopping.filter(function (x) { return !x.done; }); commit(); },
  'toggle-pass': function () { ui.showPass = !ui.showPass; render(); },
  'copy-pass': function () {
    var p = S.board.wifiPass || '';
    try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(p).then(function () { toast('Wi-Fi password copied'); }, function () { toast(fallbackCopy(p) ? 'Wi-Fi password copied' : 'Couldn’t copy. Tap Reveal instead.'); }); return; } } catch (e) {}
    toast(fallbackCopy(p) ? 'Wi-Fi password copied' : 'Couldn’t copy. Tap Reveal instead.');
  },
  'del-rule': function (b) { S.board.rules.splice(+b.dataset.id, 1); commit(); },
  'edit-board': function () {
    var b = S.board;
    var f = function (id, label, value, type, extra) { return '<div class="field"><label class="f" for="eb-' + id + '">' + label + '</label><input type="' + (type || 'text') + '" id="eb-' + id + '" name="' + id + '" value="' + esc(value || '') + '"' + (extra || '') + '></div>'; };
    openDialog({ title: 'Edit house board', submit: 'Save',
      body: f('hname', 'House name', S.house.name, 'text', ' maxlength="40"') + f('address', 'Address', S.house.address, 'text', ' maxlength="80"') +
        '<div class="two-col">' + f('wifiName', 'Wi-Fi network', b.wifiName) + f('wifiPass', 'Wi-Fi password', b.wifiPass) + '</div>' +
        '<div class="field"><label class="f" for="eb-quiet">Quiet hours</label><textarea id="eb-quiet" name="quiet" maxlength="200">' + esc(b.quiet) + '</textarea></div>' +
        '<div class="field"><label class="f" for="eb-guests">Guest policy</label><textarea id="eb-guests" name="guests" maxlength="300">' + esc(b.guests) + '</textarea></div>' +
        '<div class="two-col">' + f('leaseStart', 'Lease start', b.leaseStart, 'date') + f('leaseEnd', 'Lease end', b.leaseEnd, 'date') + '</div>' +
        f('rentDueDay', 'Rent due (day of month)', b.rentDueDay, 'number', ' min="1" max="31"') +
        f('landlord', 'Landlord / property manager', b.landlord) + f('landlordContact', 'Landlord contact', b.landlordContact),
      onSubmit: function (fm) {
        var name = val(fm, 'hname'); if (!name) return 'The house needs a name.';
        var ls = val(fm, 'leaseStart'), le = val(fm, 'leaseEnd');
        if (ls && le && le <= ls) return 'Lease end must be after lease start.';
        var rd = parseInt(val(fm, 'rentDueDay'), 10); if (!(rd >= 1 && rd <= 31)) return 'Rent due day must be 1–31.';
        S.house.name = name; S.house.address = val(fm, 'address');
        ['wifiName', 'wifiPass', 'quiet', 'guests', 'landlord', 'landlordContact'].forEach(function (k) { b[k] = val(fm, k); });
        b.leaseStart = ls; b.leaseEnd = le; b.rentDueDay = rd;
        log('📋', nm2(S.me) + ' updated the house board'); commit(); toast('House board saved'); return null;
      } });
  },
  'add-mate': function () {
    var i = S.members.length, nmate = newMate(i);
    openDialog({ title: 'Add a housemate', submit: 'Add',
      body: '<div class="field"><label class="f" for="am-name">Name</label><input type="text" id="am-name" name="name" maxlength="24"></div>' +
        '<div class="two-col"><div class="field"><label class="f" for="am-emo">Avatar</label><select id="am-emo" name="emoji">' + EMOJIS.map(function (e) { return '<option' + (e === nmate.emoji ? ' selected' : '') + '>' + e + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label class="f" for="am-col">Colour</label><select id="am-col" name="color">' + Object.keys(COLORS).map(function (c) { return '<option value="' + c + '"' + (c === nmate.color ? ' selected' : '') + '>' + COLORS[c][1] + '</option>'; }).join('') + '</select></div></div>' +
        '<p class="hint">In the real app they’d join through the invite link instead.</p>',
      onSubmit: function (f) {
        var name = val(f, 'name'); if (!name) return 'Enter a name.';
        if (S.members.some(function (m) { return m.name.toLowerCase() === name.toLowerCase(); })) return 'Someone with that name already lives here.';
        var m = { id: uid('m'), name: name, emoji: f.elements.emoji.value, color: f.elements.color.value };
        S.members.push(m);
        log('👋', name + ' joined the house'); commit(); toast(name + ' added'); return null;
      } });
  },
  'del-mate': function (b) {
    var id = b.dataset.id, m = member(id), bal = balances()[id] || 0;
    if (S.members.length <= 1) return toast('A house needs at least one person');
    if (bal !== 0) return toast(m.name + ' isn’t settled up (' + fmtCAD(bal) + '). Settle first.');
    confirmDialog('Remove ' + esc(m.name) + '?', esc(m.name) + ' will be removed from chore rotations and future bills. Past expenses stay in the history.', 'Remove', function () {
      S.members = S.members.filter(function (x) { return x.id !== id; });
      S.chores = S.chores.map(function (c) {
        var cur = choreAssignee(c), rot = c.rotation.filter(function (x) { return x !== id; });
        if (!rot.length) return null;
        var idx = rot.indexOf(cur); if (idx < 0) idx = c.idx % rot.length;
        return Object.assign({}, c, { rotation: rot, idx: idx });
      }).filter(Boolean);
      S.bills.forEach(function (bl) { bl.splitAmong = bl.splitAmong.filter(function (x) { return x !== id; }); if (bl.paidBy === id) bl.paidBy = S.members[0].id; });
      if (S.me === id) S.me = S.members[0].id;
      log('👋', m.name + ' moved out'); commit(); toast(m.name + ' removed');
    });
  }
};
function themeLabel() { var t = document.documentElement.getAttribute('data-theme'); return t === 'light' ? 'Light' : t === 'dark' ? 'Dark' : 'System'; }
function fallbackCopy(text) {
  try {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  } catch (e) { return false; }
}
function syncSetup() {
  if (!ui.setup) return;
  var n = $('#su-name'), a = $('#su-addr');
  if (n) ui.setup.name = n.value; if (a) ui.setup.address = a.value;
  $$('[data-mate]').forEach(function (el) { var m = ui.setup.mates[+el.dataset.mate]; if (m) m[el.dataset.field] = el.value; });
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled || !A[b.dataset.act]) return;
  if (dlg.open && !dlg.contains(b)) return;
  A[b.dataset.act](b);
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.mate !== undefined && ui.setup) { syncSetup(); if (el.dataset.field !== 'name') { render(); var again = $('#' + el.id); if (again) again.focus(); } }
});
document.addEventListener('submit', function (e) {
  var f = e.target, kind = f.dataset && f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  if (kind === 'shop-add') {
    var v = f.elements.item.value.trim(); if (!v) return;
    S.shopping.unshift({ id: uid('s'), name: v, addedBy: S.me, claimedBy: null, done: false });
    log('📝', nm2(S.me) + ' added “' + v + '” to the shopping list'); commit(); var inp = $('#shop-new'); if (inp) inp.focus();
  } else if (kind === 'rule-add') {
    var r = f.elements.rule.value.trim(); if (!r) return;
    S.board.rules.push(r); log('📜', nm2(S.me) + ' added a house rule'); commit(); var ri = $('#rule-new'); if (ri) ri.focus();
  } else if (kind === 'setup') {
    syncSetup();
    var s = ui.setup, err = $('#setup-err');
    var mates = s.mates.map(function (m) { return { name: m.name.trim(), emoji: m.emoji, color: m.color }; }).filter(function (m) { return m.name; });
    var names = mates.map(function (m) { return m.name.toLowerCase(); });
    var msg = !s.name.trim() ? 'Give your house a name.' : !mates.length ? 'Add at least your own name.' :
      names.some(function (n, i) { return names.indexOf(n) !== i; }) ? 'Two housemates have the same name. Add an initial to tell them apart.' : '';
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    S = makeFresh(s.name.trim(), s.address.trim(), mates);
    log('🏡', mates[0].name + ' created ' + S.house.name);
    ui.setup = null; ui.tab = 'home'; commit(); toast('House created! Share the invite link with your housemates.');
  }
});
window.addEventListener('hashchange', function () { try { var h = location.hash.slice(1); if (S && TABS.indexOf(h) >= 0 && h !== ui.tab) { ui.tab = h; render(); } } catch (e) {} });
// Re-roll chores if the tab stays open across a Monday.
document.addEventListener('visibilitychange', function () { if (!document.hidden && S && !dlg.open) render(); });
try { render(); } catch (err) {
  // Corrupted data should never brick the app: fall back to onboarding.
  if (window.console) console.error(err);
  S = null; render();
}
})();
</script>
</body>
</html>
